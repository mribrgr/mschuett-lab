# ACME-Issuer. Seit 2026-08-07 über die Gateway API statt über traefik-Ingress.
#
# Der Solver legt für jede Challenge eine HTTPRoute an und hängt sie an den
# HTTP-Listener des zentralen Gateways (templates/gateway.yaml). Vorher stand hier
# `http01.ingress.class: traefik` — mit `--disable=traefik` gibt es keinen
# Ingress-Controller mehr, der Solver hätte still nie validiert.
#
# ⚠️ Braucht `config.gatewayAPI.enabled: true` am cert-manager
# (modules/cert-manager.nix). Ohne das ignoriert cert-manager den
# gatewayHTTPRoute-Solver kommentarlos.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    email: info@mauritiusberger.de
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # Secret resource that will be used to store the account's private key.
      name: letsencrypt-staging-issuer-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: main
                namespace: default
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    email: info@mauritiusberger.de
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-issuer-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: main
                namespace: default
                kind: Gateway
