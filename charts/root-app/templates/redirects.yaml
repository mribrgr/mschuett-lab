# Kurz-Adressen unter mauritiusberger.de, die auf Lukas' Dienste weiterleiten
# (2026-10-19). Hier läuft kein Backend, nur der RequestRedirect am Gateway.
# Die zugehörigen HTTPS-Listener stehen in templates/gateway.yaml.
#
# Je Host ZWEI Routen, nicht eine mit zwei parentRefs: Cilium übersetzt
# `scheme: https` in eine Envoy-Route, die nur greift, wenn X-Forwarded-Proto
# NICHT https ist (Schleifenschutz für den üblichen http→https-Redirect). Auf
# dem HTTPS-Listener ist XFP immer https — die Route matcht nie, Envoy
# antwortet 404 (2026-10-19 so beobachtet). Deshalb:
#   • `-http`: Listener `http` (:80), mit `scheme: https`, direkt zum Ziel.
#   • ohne Suffix: HTTPS-Listener, OHNE `scheme` — das Schema der Anfrage ist
#     dort schon https und wird übernommen.
# Der ACME-Solver von cert-manager matcht auf :80 den exakten Challenge-Pfad
# und gewinnt damit die Gateway-API-Präzedenz gegen das implizite Prefix-`/`.
#
# 302 statt 301: Browser cachen einen 301 dauerhaft. Zieht ein Ziel bei Lukas
# um, wäre die alte Adresse sonst bis zum Cache-Leeren festgenagelt. Der Pfad
# wird mitgenommen (kein `path` im Filter).
#
# netbird. nur fürs Dashboard im Browser: als Management-URL für Clients taugt
# die Kurz-Adresse NICHT (gRPC folgt keinem Redirect, Lukas' OIDC-Redirects
# hängen an netbird.lukashirsch.de). Clients bleiben auf der echten URL
# (base/modules/netbird.nix in nix-config).
{{- $redirects := list
  (dict "name" "jellyfin" "target" "jellyfin.deimos.mars.lukashirsch.de")
  (dict "name" "seerr" "target" "seerr.deimos.mars.lukashirsch.de")
  (dict "name" "netbird" "target" "netbird.lukashirsch.de")
}}
{{- range $redirects }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-mauritiusberger-de-redirect-http
  namespace: default
spec:
  parentRefs:
    - name: main
      namespace: default
      kind: Gateway
      sectionName: http
  hostnames:
    - {{ .name }}.mauritiusberger.de
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ .target }}
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-mauritiusberger-de-redirect
  namespace: default
spec:
  parentRefs:
    - name: main
      namespace: default
      kind: Gateway
      sectionName: https-{{ .name }}
  hostnames:
    - {{ .name }}.mauritiusberger.de
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .target }}
            statusCode: 302
{{- end }}
