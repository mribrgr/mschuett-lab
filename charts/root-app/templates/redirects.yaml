# Kurz-Adressen unter mauritiusberger.de, die auf Lukas' Dienste weiterleiten
# (2026-10-19). Hier läuft kein Backend, nur der RequestRedirect am Gateway.
# Die zugehörigen HTTPS-Listener stehen in templates/gateway.yaml.
#
# Je Route zwei parentRefs: `http` (:80) und der eigene HTTPS-Listener. Auf :80
# geht es direkt zum Ziel statt erst auf https://<kurz-adresse>. Der
# ACME-Solver von cert-manager matcht den exakten Challenge-Pfad und gewinnt
# damit die Gateway-API-Präzedenz gegen das implizite Prefix-`/` hier — das
# Zertifikat für die Kurz-Adresse lässt sich also trotzdem ausstellen.
#
# 302 statt 301: Browser cachen einen 301 dauerhaft. Zieht ein Ziel bei Lukas
# um, wäre die alte Adresse sonst bis zum Cache-Leeren festgenagelt. Der Pfad
# wird mitgenommen (kein `path` im Filter), jellyfin.mauritiusberger.de/web/
# landet also auf …lukashirsch.de/web/.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-mauritiusberger-de-redirect
  namespace: default
spec:
  parentRefs:
    - name: main
      namespace: default
      kind: Gateway
      sectionName: http
    - name: main
      namespace: default
      kind: Gateway
      sectionName: https-jellyfin
  hostnames:
    - jellyfin.mauritiusberger.de
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: jellyfin.deimos.mars.lukashirsch.de
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-mauritiusberger-de-redirect
  namespace: default
spec:
  parentRefs:
    - name: main
      namespace: default
      kind: Gateway
      sectionName: http
    - name: main
      namespace: default
      kind: Gateway
      sectionName: https-seerr
  hostnames:
    - seerr.mauritiusberger.de
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: seerr.deimos.mars.lukashirsch.de
            statusCode: 302
---
# Nur fürs Dashboard im Browser. Als Management-URL für netbird-Clients taugt
# die Kurz-Adresse NICHT: gRPC folgt keinem Redirect, und Lukas' OIDC-Redirects
# sind an netbird.lukashirsch.de gebunden. Clients bleiben auf der echten URL
# (base/modules/netbird.nix in nix-config).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-mauritiusberger-de-redirect
  namespace: default
spec:
  parentRefs:
    - name: main
      namespace: default
      kind: Gateway
      sectionName: http
    - name: main
      namespace: default
      kind: Gateway
      sectionName: https-netbird
  hostnames:
    - netbird.mauritiusberger.de
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: netbird.lukashirsch.de
            statusCode: 302
