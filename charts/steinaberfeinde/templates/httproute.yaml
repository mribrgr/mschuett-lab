# Ersetzt den traefik-Ingress (2026-08-07, Umstieg auf Gateway API).
#
# Hängt sich an das zentrale Gateway `main` (charts/root-app/templates/gateway.yaml).
# Kein `sectionName`: die Zuordnung passiert über den Hostnamen, damit greift die
# Route sowohl auf dem HTTPS-Listener der jeweiligen Domain als auch auf dem
# HTTP-Listener. Letzteres ist gewollt — vorher lief Port 80 wegen
# `router.tls: "true"` in einen 404.
#
# www.steinaberfein.de ist NEU: der alte Ingress kannte nur die Apex-Domain,
# obwohl values.yaml `www.steinaberfein.de` als host führte. www lieferte deshalb
# 404. Beide Namen teilen sich das Secret `steinaberfein-de-tls` (siehe die zwei
# Listener im Gateway) → ein Zertifikat mit beiden SANs.
#
# Die ACME-Challenge kollidiert damit nicht: cert-manager legt für
# /.well-known/acme-challenge/… eine eigene, spezifischere HTTPRoute an, und die
# Gateway-API priorisiert den längeren Pfad-Match.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
spec:
  parentRefs:
    - name: main
      namespace: default
      kind: Gateway
  hostnames:
    - steinaberfein.de
    - www.steinaberfein.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
