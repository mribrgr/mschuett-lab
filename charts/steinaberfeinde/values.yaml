image:
  repository: ghcr.io/mribrgr/steinaberfein.de
  # GEPINNT per Digest (2026-08-07). Vorher `tag: latest` + pullPolicy Always.
  #
  # Warum Digest und nicht ein Versions-Tag: für dieses Image werden (anders als
  # bei not-just-a-developer.com, das v0.24.1 o. ä. veröffentlicht) keine
  # Versions-Tags gepusht — es gibt nur `latest`. Ein Digest ist unveränderlich
  # und damit die einzige reproduzierbare Referenz.
  #
  # ⚠️ FOLGE FÜR DEN DEPLOY-FLOW: ein neuer Website-Build wird NICHT mehr
  # automatisch ausgerollt. Nach jedem Push in mribrgr/steinaberfeinde muss der
  # Digest hier nachgezogen werden:
  #   kubectl -n default get pod -l app=steinaberfeinde \
  #     -o jsonpath='{.items[0].status.containerStatuses[0].imageID}'
  # Wer Continuous Deployment zurück will, sollte die CI ein Versions-Tag pushen
  # und dieses hier setzen — nicht zurück auf `latest`.
  digest: "sha256:ee460589a48972bdfc98cf9b2c26d1cf70a5d9f12e20947c120d420248cc6a29"
  # Fallback, falls `digest` geleert wird:
  tag: latest
  # Bei festem Digest ist ein Re-Pull pro Start sinnlos.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# Kein `ingress:`-Block mehr (2026-08-07). Das Routing läuft über eine HTTPRoute
# am zentralen Gateway (templates/httproute.yaml), die Hostnamen stehen dort.
#
# Der alte Block war ohnehin irreführend: `host: www.steinaberfein.de` wurde von
# templates/ingress.yaml gar nicht gelesen — dort war `steinaberfein.de`
# hartcodiert. Ergebnis: www lief auf 404. Jetzt werden beide Namen bedient.
