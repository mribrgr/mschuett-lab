[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bricklink-mcp"
version = "0.1.0"
description = "MCP-Server für den eigenen BrickLink-Store (Store API v1 + Offline-Katalogindex)"
requires-python = ">=3.12"
dependencies = [
  "fastmcp",
  "requests",
  "requests-oauthlib",
]

[project.scripts]
bricklink-mcp = "bricklink_mcp.server:main"

[tool.setuptools.packages.find]
include = ["bricklink_mcp*"]
